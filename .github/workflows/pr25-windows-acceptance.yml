name: PR 25 Windows acceptance build

on:
  push:
    branches: [ci/25-windows-acceptance]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: jetbrains
          java-version: '21.0.9'
          java-package: jdk
          cache: gradle
      - name: Build Windows desktop application
        working-directory: apps/client
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --console=plain -PdesktopOnly=true "-PjbrHome=$env:JAVA_HOME" :desktopApp:createDistributable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload application for acceptance testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr25-windows-app
          path: apps/client/desktopApp/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 2
