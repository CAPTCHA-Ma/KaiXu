name: Client tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: client-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM and desktop tests (${{ github.event_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run shared JVM and desktop tests
        working-directory: apps/client
        run: xvfb-run -a ./gradlew --no-daemon --console=plain -PdesktopOnly=true :shared:jvmTest :desktopApp:test

      - name: Save JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-test-results
          path: |
            apps/client/shared/build/test-results/jvmTest/TEST-*.xml
            apps/client/desktopApp/build/test-results/test/TEST-*.xml
          retention-days: 7
